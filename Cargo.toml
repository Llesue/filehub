[package]
name = "filehub"
version = "0.1.8"
edition = "2024"
rust-version = "1.100"
description = "Self-hosted file manager"
publish = false

[dependencies]
anyhow = "1"
futures-util = "0.3"
arc-swap = "1.9.5"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23.1"
clap = { version = "4", features = ["derive", "env"] }
globset = "0.4.21"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp"] }
mime_guess = "2"
parking_lot = "0.13.0"
percent-encoding = "2.3.2"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time", "fs"] }
tokio-util = { version = "0.7.20", features = ["io", "io-util"] }
tower-http = { version = "0.6", features = ["trace", "request-id", "catch-panic", "compression-gzip", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
jpeg-decoder = { version = "0.3", default-features = false }
kamadak-exif = "0.6"

[dev-dependencies]
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
tracing-appender = "0.2"
windows-service = { version = "0.8.1" }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_EventLog", "Win32_System_Console"] }
