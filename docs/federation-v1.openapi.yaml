openapi: 3.1.0
info:
  title: FileHub Federation API
  version: "1"
  description: |
    FileHub 实例之间的目录挂载协议。v1 冻结：只允许追加字段、能力和错误码。
    路径中的 `path` 相对 grant 根，空字符串表示 grant 根。

servers:
  - url: /api/federation/v1

security:
  - bearer: []

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: fhfed_<token>

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 128 }
      description: |
        写操作去重键。相同键的重复请求返回第一次的响应；操作仍在执行时
        返回 409。键在操作失败后自动释放，可以重试。

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - BAD_REQUEST
                - INVALID_PATH
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - PRECONDITION_FAILED
                - QUOTA_EXCEEDED
                - ENTRY_LIMIT_EXCEEDED
                - TOO_LARGE
                - RATE_LIMITED
                - UNSUPPORTED_MEDIA
                - TOKEN_REVOKED
                - TOKEN_EXPIRED
                - GRANT_REVOKED
                - INTERNAL_ERROR
            message:
              type: string

    Info:
      type: object
      properties:
        product: { type: string, const: filehub }
        api: { type: string, const: federation }
        version: { type: integer, const: 1 }
        server_version: { type: string }
        instance_id: { type: string }
        capabilities:
          type: array
          items: { type: string }
        chunk_size_max: { type: integer }
        path_max: { type: integer }

    Grant:
      type: object
      properties:
        id: { type: integer, format: int64 }
        label: { type: string }
        mode: { type: string, enum: [ro, rw] }

    Entry:
      type: object
      properties:
        name: { type: string }
        is_dir: { type: boolean }
        size: { type: integer, format: int64 }
        modified: { type: integer, format: int64 }
        mime_type: { type: string }
        has_preview: { type: boolean }

    ListPage:
      type: object
      properties:
        path: { type: string }
        read_only: { type: boolean }
        entries:
          type: array
          items: { $ref: "#/components/schemas/Entry" }
        next_cursor:
          type: [string, "null"]

    Stat:
      type: object
      properties:
        path: { type: string }
        is_dir: { type: boolean }
        size: { type: integer, format: int64 }
        modified: { type: integer, format: int64 }
        etag: { type: string }
        mime_type: { type: string }
        read_only: { type: boolean }

    BatchResult:
      type: object
      properties:
        done:
          type: array
          items: { type: object }
        failed:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              code: { type: string }
              message: { type: string }

    SearchResult:
      type: object
      properties:
        indexed: { type: boolean }
        results:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              name: { type: string }
              is_dir: { type: boolean }
              size: { type: integer, format: int64 }
              modified: { type: integer, format: int64 }
        next_cursor:
          type: [string, "null"]

    UploadCreated:
      type: object
      properties:
        id: { type: string }
        chunk_size: { type: integer }
        total_size: { type: integer, format: int64 }

    UploadStatus:
      type: object
      properties:
        received: { type: integer, format: int64 }
        total_chunks: { type: integer }
        received_bytes: { type: integer, format: int64 }
        expires_at: { type: integer, format: int64 }

paths:
  /info:
    get:
      summary: 服务与能力信息（无需认证）
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Info" }

  /grants:
    get:
      summary: 当前令牌可见的授权目录
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  grants:
                    type: array
                    items: { $ref: "#/components/schemas/Grant" }

  /list:
    get:
      summary: 目录列表
      parameters:
        - { name: grant, in: query, required: true, schema: { type: integer } }
        - { name: path, in: query, schema: { type: string } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000 } }
        - { name: sort, in: query, schema: { type: string, enum: [name, modified, size] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListPage" }

  /stat:
    get:
      summary: 单路径元信息
      parameters:
        - { name: grant, in: query, required: true, schema: { type: integer } }
        - { name: path, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stat" }

  /download:
    get:
      summary: 下载文件，支持 Range
      parameters:
        - { name: grant, in: query, required: true, schema: { type: integer } }
        - { name: path, in: query, schema: { type: string } }
        - { name: inline, in: query, schema: { type: string, enum: ["0", "1"] } }
      responses:
        "200": { description: 完整文件 }
        "206": { description: 部分内容 }
        "304": { description: ETag 命中 }
        "416": { description: Range 不可满足 }

  /thumb:
    get:
      summary: 缩略图（同步生成）
      parameters:
        - { name: grant, in: query, required: true, schema: { type: integer } }
        - { name: path, in: query, schema: { type: string } }
        - { name: w, in: query, schema: { type: integer } }
        - { name: edge, in: query, schema: { type: integer } }
        - { name: fit, in: query, schema: { type: string } }
      responses:
        "200":
          description: JPEG
          content:
            image/jpeg:
              schema: { type: string, format: binary }

  /dir-size:
    get:
      summary: 目录大小
      parameters:
        - { name: grant, in: query, required: true, schema: { type: integer } }
        - { name: path, in: query, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  bytes: { type: integer, format: int64 }
                  files: { type: integer, format: int64 }
                  truncated: { type: boolean }

  /search:
    get:
      summary: 文件名搜索（授权侧索引）
      parameters:
        - { name: grant, in: query, required: true, schema: { type: integer } }
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [image, video, audio, text, pdf, dir, file] } }
        - { name: min_size, in: query, schema: { type: integer, format: int64 } }
        - { name: max_size, in: query, schema: { type: integer, format: int64 } }
        - { name: modified_after, in: query, schema: { type: integer, format: int64 } }
        - { name: modified_before, in: query, schema: { type: integer, format: int64 } }
        - { name: is_dir, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }

  /mkdir:
    post:
      summary: 新建目录
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant, path]
              properties:
                grant: { type: integer }
                path: { type: string }
      responses:
        "201": { description: 已创建 }

  /touch:
    post:
      summary: 新建空文件
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant, path]
              properties:
                grant: { type: integer }
                path: { type: string }
      responses:
        "201": { description: 已创建 }

  /rename:
    post:
      summary: 重命名
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant, path, name]
              properties:
                grant: { type: integer }
                path: { type: string }
                name: { type: string }
      responses:
        "200": { description: OK }

  /copy:
    post:
      summary: 复制（同 grant 内批量）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant, paths, dest]
              properties:
                grant: { type: integer }
                paths:
                  type: array
                  items: { type: string }
                dest: { type: string }
                overwrite: { type: boolean }
      responses:
        "200": { description: 全部成功 }
        "207": { description: 部分成功 }

  /move:
    post:
      summary: 移动（同 grant 内批量）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant, paths, dest]
              properties:
                grant: { type: integer }
                paths:
                  type: array
                  items: { type: string }
                dest: { type: string }
                overwrite: { type: boolean }
      responses:
        "200": { description: 全部成功 }
        "207": { description: 部分成功 }

  /delete:
    post:
      summary: 删除（批量）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant, paths]
              properties:
                grant: { type: integer }
                paths:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: 全部成功 }
        "207": { description: 部分成功 }

  /uploads:
    post:
      summary: 创建上传会话
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant, filename, total_size]
              properties:
                grant: { type: integer }
                dir: { type: string }
                filename: { type: string }
                total_size: { type: integer, format: int64 }
                chunk_size: { type: integer }
                if_match:
                  type: string
                  description: 目标文件必须仍然匹配该 ETag，否则完成上传时返回 412。
                if_none_match:
                  type: string
                  description: 传 "*" 时目标文件已存在则返回 412。
      responses:
        "201":
          description: 已创建
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadCreated" }

  /uploads/{id}:
    get:
      summary: 上传状态
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadStatus" }
    delete:
      summary: 取消上传
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: 已取消 }

  /uploads/{id}/chunks/{index}:
    put:
      summary: 写入分片
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: OK }

  /uploads/{id}/complete:
    post:
      summary: 完成上传
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  etag: { type: string }
                  size: { type: integer, format: int64 }

  /thumb-warm:
    post:
      summary: 预热目录缩略图（授权侧生成）
      description: |
        同一批路径重复调用不会重复排队。只预热列表尺寸（width 默认 256）。
        按令牌限流，默认 2 次/分钟。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant, paths]
              properties:
                grant: { type: integer }
                paths:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string }
                width: { type: integer, minimum: 16, maximum: 1024, default: 256 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: integer }
                  cached: { type: integer }
                  skipped: { type: integer }
                  disabled: { type: boolean }

  /unzip:
    post:
      summary: 就地解压 ZIP（同步执行）
      description: |
        由授权侧校验条目路径、加密标志、符号链接与压缩比，然后解压到
        target（默认取归档文件名去掉 .zip）。失败时不留下部分文件。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grant, path]
              properties:
                grant: { type: integer }
                path: { type: string }
                target: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  target: { type: string }
                  entries: { type: integer }
                  bytes: { type: integer, format: int64 }

  /audio-info:
    get:
      summary: 音轨探测（授权侧 ffprobe）
      parameters:
        - { name: grant, in: query, required: true, schema: { type: integer } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ffmpeg: { type: boolean }
                  default_track: { type: integer, nullable: true }
                  has_supported_track: { type: boolean }
                  tracks:
                    type: array
                    items:
                      type: object
                      properties:
                        index: { type: integer }
                        codec: { type: string }
                        channels: { type: integer }
                        layout: { type: string }
                        language: { type: string }
                        default: { type: boolean }
                        supported: { type: boolean }
