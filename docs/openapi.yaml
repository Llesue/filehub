openapi: 3.1.0
info:
  title: FileHub API
  version: 0.1.8
  description: FileHub 自托管文件管理器 API。所有业务接口前缀 /api/v1。
servers:
  - url: /
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: setup
  - name: auth
  - name: files
  - name: transfer
  - name: index
  - name: shares
  - name: admin
  - name: terminal

paths:
  /api/v1/setup/status:
    get:
      tags: [setup]
      security: []
      summary: 是否完成初始化
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  initialized: { type: boolean }
  /api/v1/setup:
    post:
      tags: [setup]
      security: []
      summary: 首次初始化管理员
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, username, password]
              properties:
                token: { type: string }
                username: { type: string }
                password: { type: string }
                language:
                  { type: string, enum: [zh-CN, en], description: 首个管理员偏好语言；缺省用 ui.default_locale }
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/login:
    post:
      tags: [auth]
      security: []
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/v1/logout:
    post:
      tags: [auth]
      summary: 退出当前会话
      responses:
        '204': { description: Logged out }
  /api/v1/me:
    get:
      tags: [auth]
      summary: 当前用户与 CSRF token
      responses:
        '200': { $ref: '#/components/responses/AuthResponse' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/me/password:
    post:
      tags: [auth]
      summary: 修改当前用户密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/events:
    get:
      tags: [auth]
      summary: 当前用户实时事件流（SSE）
      description: 使用 session cookie 鉴权；只推送当前用户事件，管理员额外收到 admin 事件。事件包含 `id`、`event`、`data`，心跳间隔 20 秒。
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/edit/presence:
    post:
      tags: [files]
      summary: 编辑占用提示（仅提示，不做强锁）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root, path, state, client]
              properties:
                root: { type: integer, format: int64 }
                path: { type: string }
                state: { type: string, enum: [open, close] }
                client: { type: string, description: 每个标签页独立的随机标识 }
      responses:
        '200': { description: 当前同文件的其他编辑器数量与过期时间 }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/auth/tokens:
    get:
      tags: [auth]
      summary: 列出 API Token
      responses:
        '200': { description: OK }
    post:
      tags: [auth]
      summary: 创建 API Token（明文只返回一次）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name: { type: string, maxLength: 64 }
                scope: { type: string, enum: [read, write] }
                expires_at: { type: integer, format: int64, nullable: true }
      responses:
        '200': { description: OK }
  /api/v1/auth/tokens/{id}:
    delete:
      tags: [auth]
      summary: 撤销 API Token
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }

  /api/v1/roots:
    get:
      tags: [files]
      summary: 当前用户授权根
      responses:
        '200': { description: OK }
  /api/v1/branding:
    get:
      tags: [branding]
      security: []
      summary: 公开品牌信息（名称、图标地址、版本）
      responses:
        '200': { description: OK }
  /api/v1/branding/icon:
    get:
      tags: [branding]
      security: []
      summary: 品牌图标（PNG，支持 ETag/304）
      responses:
        '200': { description: Image }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/admin/branding/icon:
    post:
      tags: [branding, admin]
      summary: 上传品牌图标（PNG/JPEG/WebP，最大 2MiB，2048px）
      responses:
        '200': { description: Version and icon URL }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      tags: [branding, admin]
      summary: 恢复默认图标（首字母）
      responses:
        '200': { description: OK }
  /api/v1/list:
    get:
      tags: [files]
      summary: 目录列表
      description: |
        响应包含 `read_only` 与 `read_only_reason`。`read_only_reason` 为 `policy`（root 或可信链接配置只读）或 `filesystem`（服务进程没有当前目录的写权限），两者皆无时为 `null`。写入只读目录返回 `403 PERMISSION_DENIED`（文件系统）或 `403 FORBIDDEN`（策略）。
      parameters:
        - { name: root, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: path, in: query, schema: { type: string, default: '' } }
        - { name: sort, in: query, schema: { type: string, enum: [name, size, modified], default: name } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/fs/image-info:
    get:
      tags: [files]
      summary: 图片头信息与预览可行性预检
      description: 只读图片头，不解码像素。超过 JPEG/其他图片像素上限或源文件大小上限时 `previewable=false`，客户端不应打开灯箱。
      parameters:
        - { name: root, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  width: { type: integer, nullable: true }
                  height: { type: integer, nullable: true }
                  pixels: { type: integer, format: int64, nullable: true }
                  limit: { type: integer, format: int64, nullable: true }
                  previewable: { type: boolean }
                  reason: { type: string, nullable: true, enum: [too_large, max_source, unsupported, null] }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/properties:
    get:
      tags: [files]
      summary: 文件/目录属性（含图片尺寸与 EXIF）
      parameters:
        - { name: root, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/fs/dir-size:
    get:
      tags: [files]
      summary: 目录大小状态（快速返回，后台 worker 统计）
      parameters:
        - { name: root, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ready, queued, running, error] }
                  size: { type: integer, format: int64, nullable: true }
                  indexed: { type: boolean }
                  partial: { type: boolean }
                  stale: { type: boolean }
                  error: { type: string, nullable: true }
                  job_id: { type: string, nullable: true }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/fs/transfer-jobs:
    post:
      tags: [transfer]
      summary: 创建后台复制/移动任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_root, paths, dest_root]
              properties:
                source_root: { type: integer, format: int64 }
                paths:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string }
                dest_root: { type: integer, format: int64 }
                dest_path: { type: string, default: '' }
                move_items: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string, enum: [queued, running] }
                  created: { type: boolean }
  /api/v1/fs/transfer-jobs/{id}:
    get:
      tags: [transfer]
      summary: 复制/移动任务状态
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [transfer]
      summary: 取消复制/移动任务
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/jobs:
    get:
      tags: [jobs]
      summary: 当前用户的后台任务
      description: 返回排队/运行中的任务，以及 `since` 之后结束的任务，用于刷新页面后恢复进度面板。
      parameters:
        - { name: since, in: query, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items: { type: object }
  /api/v1/jobs/{id}:
    get:
      tags: [jobs]
      summary: 后台任务状态
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [jobs]
      summary: 取消后台任务
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/download:
    get:
      tags: [files]
      summary: 单文件下载（Range/ETag）
      parameters:
        - { name: root, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: inline, in: query, schema: { type: boolean, default: false }, description: 图片/视频以 inline 展示；SVG 仍强制下载 }
      responses:
        '200': { description: File }
        '206': { description: Partial content }
        '304': { description: Not modified }
        '416': { description: Range not satisfiable }
  /api/v1/download/zip:
    post:
      tags: [transfer]
      summary: 流式 ZIP 下载
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root, paths]
              properties:
                root: { type: integer, format: int64 }
                paths:
                  type: array
                  maxItems: 1000
                  items: { type: string }
      responses:
        '200': { description: application/zip }
        '413': { $ref: '#/components/responses/Error' }
  /api/v1/uploads:
    post:
      tags: [transfer]
      summary: 创建分段上传会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root, filename, total_size]
              properties:
                root: { type: integer, format: int64 }
                path: { type: string, default: '' }
                filename: { type: string }
                total_size:
                  {
                    type: integer,
                    format: int64,
                    minimum: 0,
                    description: 允许为 0，用于上传空文件,
                  }
                chunk_size: { type: integer, format: int64, nullable: true }
      responses:
        '200': { description: OK }
        '507': { $ref: '#/components/responses/Error' }
  /api/v1/uploads/{id}:
    get:
      tags: [transfer]
      summary: 查询上传进度
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /api/v1/uploads/{id}/chunks/{index}:
    put:
      tags: [transfer]
      summary: 上传分片
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: index, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200': { description: OK }
  /api/v1/uploads/{id}/complete:
    post:
      tags: [transfer]
      summary: 完成上传并原子落盘
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }
  /api/v1/fs/delete/preview:
    post:
      tags: [files]
      summary: 生成删除确认令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root, paths]
              properties:
                root: { type: integer, format: int64 }
                paths: { type: array, items: { type: string } }
      responses:
        '200': { description: OK }
  /api/v1/fs/delete:
    post:
      tags: [files]
      summary: 二次确认后永久删除
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                confirm_name: { type: string, nullable: true }
      responses:
        '204': { description: Deleted }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/thumb:
    get:
      tags: [files]
      summary: 缩略图
      description: '默认异步：缓存未命中时立即返回透明占位图（`X-FileHub-Thumb-State: pending`），生成完成后通过 `thumbnail.ready` 事件通知；`wait=1` 恢复同步等待。'
      parameters:
        - { name: root, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: w, in: query, schema: { type: integer, minimum: 16, maximum: 4096, default: 256 } }
        - { name: edge, in: query, schema: { type: integer, minimum: 16, maximum: 4096, description: 长边上限受 thumbnails.preview_edge 限制 } }
        - { name: fit, in: query, schema: { type: string, enum: [width, short, long], default: width } }
        - { name: wait, in: query, schema: { type: integer, enum: [0, 1], default: 0 } }
      responses:
        '200':
          description: image/jpeg；异步占位响应为 image/png
          headers:
            X-FileHub-Thumb-State:
              schema: { type: string, enum: [pending] }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/thumb/cancel:
    post:
      tags: [files]
      summary: 取消某个目录排队中的缩略图任务，或关闭灯箱时取消当前预览任务
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root, path, scope]
              properties:
                root: { type: integer, format: int64 }
                path: { type: string, description: '相对 root 的目录（scope=dir）或文件（scope=file）路径' }
                scope: { type: string, enum: [dir, file] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cancelled: { type: integer }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/file/probe:
    get:
      tags: [files]
      summary: 检查文件是否可作为 UTF-8 文本编辑
      parameters:
        - { name: root, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_text: { type: boolean }
                  reason: { type: string }
                  size: { type: integer, format: int64 }
        '404': { $ref: '#/components/responses/Error' }
  /api/v1/file:
    get:
      tags: [files]
      summary: 读取文本文件
      description: '响应包含 `line_ending`（lf/crlf/mixed）、`writable` 与 `read_only_reason`（file/directory）。保存需要文件与父目录都可写。'
      parameters:
        - { name: root, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [content, etag, size, modified, line_ending, writable, read_only_reason]
                properties:
                  content: { type: string }
                  etag: { type: string }
                  size: { type: integer, format: int64 }
                  modified: { type: integer, format: int64 }
                  line_ending: { type: string, enum: [lf, crlf, mixed] }
                  writable: { type: boolean }
                  read_only_reason: { type: string, nullable: true, enum: [file, directory, null] }
        '403': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
    put:
      tags: [files]
      summary: 保存文本文件（If-Match）
      parameters:
        - { name: root, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: path, in: query, required: true, schema: { type: string } }
        - { name: If-Match, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '200': { description: OK }
        '412': { $ref: '#/components/responses/Error' }

  /api/v1/terminal/ws:
    get:
      tags: [terminal]
      summary: WebSocket 受限命令终端的升级端点
      description: 使用 WebSocket，首条消息必须是带 CSRF token 的 init 消息。
      responses:
        '101': { description: Switching Protocols }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }

  /api/v1/index:
    post:
      tags: [index]
      summary: 触发目录索引
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root]
              properties:
                root: { type: integer, format: int64 }
                path: { type: string, default: '' }
                recursive: { type: boolean, default: false }
      responses:
        '200':
          description: 索引任务已入队
          content:
            application/json:
              schema:
                type: object
                properties:
                  job_id: { type: string }
                  status: { type: string, enum: [queued, running] }
                  indexing: { type: boolean }
                  covered_by: { type: string, nullable: true }
        '503': { $ref: '#/components/responses/Error' }
  /api/v1/index/status:
    get:
      tags: [index]
      summary: 索引状态
      parameters:
        - { name: root, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: path, in: query, schema: { type: string } }
      responses:
        '200': { description: OK }
  /api/v1/search:
    get:
      tags: [index]
      summary: 文件名搜索
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
        - { name: root, in: query, required: true, schema: { type: integer, format: int64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
        - { name: min_size, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: max_size, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: modified_after, in: query, schema: { type: integer, format: int64 }, description: Unix 秒，包含 }
        - { name: modified_before, in: query, schema: { type: integer, format: int64 }, description: Unix 秒，包含 }
        - { name: is_dir, in: query, schema: { type: boolean } }
        - { name: kind, in: query, schema: { type: string, enum: [image, video, audio, text, pdf, dir, file] } }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/search/all:
    get:
      tags: [index]
      summary: 跨所有最外层 root 的统一文件名搜索（游标分页）
      description: 跳过被父 root 覆盖的子 root，单次 FTS 查询；按 index_entries.id 游标分页。少于 3 个字符返回 400；2 个中文字符走 bigram 索引。
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 }, description: 至少 3 字符；2 个中文字符允许 }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: cursor, in: query, schema: { type: string }, description: 上一页返回的 next_cursor }
        - { name: min_size, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: max_size, in: query, schema: { type: integer, format: int64, minimum: 0 } }
        - { name: modified_after, in: query, schema: { type: integer, format: int64 } }
        - { name: modified_before, in: query, schema: { type: integer, format: int64 } }
        - { name: kind, in: query, schema: { type: string, enum: [image, video, audio, text, pdf, dir, file] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        root_id: { type: integer, format: int64 }
                        name: { type: string }
                        path: { type: string }
                        is_dir: { type: boolean }
                        size: { type: integer, format: int64 }
                        modified: { type: integer, format: int64 }
                        mime_type: { type: string }
                        has_preview: { type: boolean }
                  next_cursor: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/cmd:
    post:
      tags: [files]
      summary: 受限命令执行
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root, line]
              properties:
                root: { type: integer, format: int64 }
                cwd: { type: string, default: '' }
                line: { type: string }
                confirm: { type: boolean, default: false }
      responses:
        '200': { description: OK }
        '409': { $ref: '#/components/responses/Error' }

  /api/v1/shares:
    get:
      tags: [shares]
      summary: 当前用户的分享
      responses:
        '200': { description: OK }
    post:
      tags: [shares]
      summary: 创建分享
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [root, path]
              properties:
                root: { type: integer, format: int64 }
                path: { type: string }
                password: { type: string, nullable: true }
                expires_at: { type: integer, format: int64, nullable: true }
                read_only: { type: boolean, default: true }
      responses:
        '200': { description: Token returned once }
  /api/v1/shares/{id}:
    delete:
      tags: [shares]
      summary: 撤销分享
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Revoked }
  /api/v1/public/shares/{token}:
    get:
      tags: [shares]
      security: []
      summary: 公开分享元数据/目录列表
      description: 目录分享响应包含 `read_only`；集合分享返回扁平 `entries`（含 `item_id`），只读分享的页面不应显示上传控件。
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
        - { name: X-Share-Ticket, in: header, schema: { type: string } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Error' }
  /api/v1/public/shares/{token}/unlock:
    post:
      tags: [shares]
      security: []
      summary: 密码分享解锁
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string }
      responses:
        '200': { description: Ticket }
  /api/v1/public/shares/{token}/download:
    get:
      tags: [shares]
      security: []
      summary: 公开分享下载
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
        - { name: X-Share-Ticket, in: header, schema: { type: string } }
      responses:
        '200': { description: File }

  /api/v1/public/shares/{token}/events:
    get:
      tags: [shares]
      security: []
      summary: 公开分享实时事件流（SSE）
      description: 仅推送该分享的访问/下载/上传/缩略图事件；已撤销返回 410 `SHARE_REVOKED`，已过期返回 410 `SHARE_EXPIRED`，未知链接返回 404。密码分享需在 `ticket` 查询参数中携带解锁票据。
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
        - { name: ticket, in: query, schema: { type: string } }
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /api/v1/admin/users:
    get:
      tags: [admin]
      summary: 用户列表
      responses:
        '200': { description: OK }
    post:
      tags: [admin]
      summary: 创建用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                role: { type: string, enum: [admin, user], default: user }
                quota_bytes: { type: integer, format: int64, nullable: true }
      responses:
        '200': { description: OK }
  /api/v1/admin/users/usage:
    get:
      tags: [admin]
      summary: 批量用户用量（缓存，未命中时后台统计）
      responses:
        '200': { description: OK }
  /api/v1/admin/roots:
    get:
      tags: [admin]
      summary: 所有用户的存储目录（一次加载，避免 N+1）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  roots:
                    type: object
                    additionalProperties:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { type: integer, format: int64 }
                          alias: { type: string }
                          real_path: { type: string }
                          read_only: { type: boolean }
                          sort_order: { type: integer }
                          covered_by: { type: string, nullable: true }
                          covered_by_id: { type: integer, format: int64, nullable: true }
  /api/v1/admin/status:
    get:
      tags: [admin]
      summary: 后台任务、数据库与慢请求摘要
      responses:
        '200': { description: OK }
  /api/v1/admin/audit:
    get:
      tags: [admin]
      summary: 审计日志（keyset 分页）
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: cursor, in: query, schema: { type: string }, description: 上一页最后一条的 id；也接受 before_id }
        - { name: before_id, in: query, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
  /api/v1/admin/users/{id}:
    put:
      tags: [admin]
      summary: 更新用户
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, nullable: true }
                role: { type: string, enum: [admin, user], nullable: true }
                quota_bytes: { type: integer, format: int64, nullable: true }
                clear_quota: { type: boolean, nullable: true }
                disabled: { type: boolean, nullable: true }
      responses:
        '200': { description: OK }
    delete:
      tags: [admin]
      summary: 软删除用户
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Disabled }
  /api/v1/admin/users/{id}/roots:
    get:
      tags: [admin]
      summary: 用户存储目录
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: OK }
    post:
      tags: [admin]
      summary: 分配存储目录
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, alias]
              properties:
                path: { type: string }
                alias: { type: string }
                read_only: { type: boolean, default: false }
                sort_order: { type: integer, default: 0 }
      responses:
        '200': { description: OK }
  /api/v1/admin/users/{id}/roots/{rootId}:
    put:
      tags: [admin]
      summary: 更新存储目录
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: rootId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alias]
              properties:
                alias: { type: string }
                read_only: { type: boolean, default: false }
                sort_order: { type: integer, default: 0 }
      responses:
        '200': { description: OK }
    delete:
      tags: [admin]
      summary: 移除存储目录
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: rootId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
  /api/v1/admin/server-paths:
    get:
      tags: [admin]
      summary: 存储目录列表
      responses:
        '200': { description: OK }
    post:
      tags: [admin]
      summary: 登记服务器存储目录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path, alias]
              properties:
                path: { type: string, description: 服务器绝对目录，例如 /mnt/red }
                alias: { type: string, description: 显示别名，例如 红盘 }
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/admin/server-paths/{id}:
    delete:
      tags: [admin]
      summary: 删除存储目录
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/v1/admin/trusted-links:
    get:
      tags: [admin]
      summary: 可信软链接列表
      responses:
        '200': { description: OK }
    post:
      tags: [admin]
      summary: 登记可信软链接
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [link_path, target_path]
              properties:
                link_path: { type: string }
                target_path: { type: string }
                access: { type: string, enum: [inherit, read_only, read_write], default: inherit }
      responses:
        '200': { description: OK }
  /api/v1/admin/trusted-links/{id}:
    delete:
      tags: [admin]
      summary: 撤销可信软链接
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: Deleted }
  /api/v1/admin/settings:
    get:
      tags: [admin]
      summary: 生效配置与来源
      responses:
        '200': { description: OK }
    put:
      tags: [admin]
      summary: 写入 DB 覆盖
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, value]
              properties:
                key: { type: string }
                value: {}
      responses:
        '200': { description: OK }
    patch:
      tags: [admin]
      summary: 批量写入 DB 覆盖（一次构建并重载配置）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [values]
              properties:
                values:
                  type: object
                  additionalProperties: {}
                  maxProperties: 32
      responses:
        '200': { description: OK }
        '400': { $ref: '#/components/responses/Error' }
  /api/v1/admin/settings/{key}:
    delete:
      tags: [admin]
      summary: 清除 DB 覆盖
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: OK }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: filehub_session
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Error:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    AuthResponse:
      description: Authenticated user
      content:
        application/json:
          schema:
            type: object
            properties:
              user: { $ref: '#/components/schemas/User' }
              csrf_token: { type: string }
              auth: { type: string, enum: [session, token] }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, enum: [admin, user] }
        quota_bytes: { type: integer, format: int64, nullable: true }
        disabled: { type: boolean }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }
