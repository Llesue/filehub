name: Hotfix aarch64 asset

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  aarch64:
    name: Rebuild and replace aarch64 asset
    if: contains(github.event.head_commit.message, '[hotfix-aarch64]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: mlugg/setup-zig@v2

      - uses: Swatinem/rust-cache@v2

      - name: Frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build
        run: |
          cargo install cargo-zigbuild --locked
          cargo zigbuild --release --locked --target aarch64-unknown-linux-musl

      - name: Replace release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.1.9
          VERSION=0.1.9
          NAME="filehub-${VERSION}-aarch64-unknown-linux-musl"
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/filehub "dist/${NAME}"
          chmod +x "dist/${NAME}"
          file "dist/${NAME}"
          sha256sum "dist/${NAME}" > "dist/${NAME}.sha256"
          cat "dist/${NAME}.sha256"

          mkdir -p /tmp/rel
          gh release download "$TAG" -p SHA256SUMS -D /tmp/rel

          python3 - "/tmp/rel/SHA256SUMS" "dist/${NAME}" "$NAME" <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          sums, binary, name = sys.argv[1], sys.argv[2], sys.argv[3]
          digest = hashlib.sha256(Path(binary).read_bytes()).hexdigest()
          lines = Path(sums).read_text().splitlines()
          updated, seen = [], False
          for line in lines:
              if line.endswith(name):
                  updated.append(f"{digest}  {name}")
                  seen = True
              else:
                  updated.append(line)
          if not seen:
              raise SystemExit(f"{name} missing from SHA256SUMS")
          Path(sums).write_text("\n".join(updated) + "\n")
          print("\n".join(updated))
          PY

          gh release upload "$TAG" \
            "dist/${NAME}" \
            "dist/${NAME}.sha256" \
            /tmp/rel/SHA256SUMS \
            --clobber

      - name: Verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.1.9 --json assets \
            --jq '.assets[] | select(.name | contains("aarch64")) | "\(.name) \(.size) \(.state)"'
