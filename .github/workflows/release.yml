name: Release build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-x86_64:
    name: Linux x86_64 musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package executable
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="filehub-${VERSION}-x86_64-unknown-linux-musl"
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/filehub "dist/${NAME}"
          chmod +x "dist/${NAME}"
          sha256sum "dist/${NAME}" > "dist/${NAME}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/*

  linux-aarch64:
    name: Linux aarch64 musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: mlugg/setup-zig@v2

      - uses: Swatinem/rust-cache@v2

      - name: Frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build
        run: |
          cargo install cargo-zigbuild --locked
          cargo zigbuild --release --locked --target aarch64-unknown-linux-musl

      - name: Package executable
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="filehub-${VERSION}-aarch64-unknown-linux-musl"
          mkdir -p dist
          cp target/aarch64-unknown-linux-musl/release/filehub "dist/${NAME}"
          chmod +x "dist/${NAME}"
          sha256sum "dist/${NAME}" > "dist/${NAME}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: dist/*

  windows-x86_64:
    name: Windows x86_64 MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package executable
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $name = "filehub-$version-x86_64-pc-windows-msvc.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/filehub.exe" "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content "dist/$name.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/*

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux-x86_64, linux-aarch64, windows-x86_64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum $(find . -maxdepth 1 -type f -name 'filehub-*' ! -name '*.sha256' -printf '%f\n' | sort) > SHA256SUMS

      - name: Release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python3 - "$VERSION" > release-notes.md <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          entries = []
          for path, heading in (
              ("CHANGELOG.md", f"# FileHub v{version}"),
              ("CHANGELOG.zh-CN.md", f"# FileHub v{version}（中文）"),
          ):
              changelog = Path(path)
              if not changelog.exists():
                  continue
              text = changelog.read_text()
              match = re.search(
                  rf"^## v{re.escape(version)}\b.*?(?=^## |\Z)",
                  text,
                  re.MULTILINE | re.DOTALL,
              )
              if not match:
                  continue
              body = match.group(0).split("\n", 1)[1].strip()
              entries.append(f"{heading}\n\n{body}")
          if not entries:
              raise SystemExit(f"CHANGELOG entry for v{version} not found")
          notes = "\n\n---\n\n".join(entries)
          previous = (
              f"v{version.rsplit('.', 1)[0]}."
              f"{int(version.rsplit('.', 1)[1]) - 1}"
          )
          print(
              f"{notes}\n\n**Full Changelog**: "
              f"https://github.com/Llesue/filehub/compare/{previous}...v{version}"
          )
          PY

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
