name: Sync release notes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, '[release-notes]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update latest release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          echo "Updating release notes for $tag"
          gh release edit "$tag" --notes-file CHANGELOG.md
