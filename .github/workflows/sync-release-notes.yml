name: Sync release notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: contains(github.event.head_commit.message, '[release-notes]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update latest release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')
          version="${tag#v}"
          echo "Updating release notes for $tag"
          if [ -f "release-notes/${version}.md" ]; then
            echo "using release-notes/${version}.md"
            cp "release-notes/${version}.md" /tmp/release-notes.md
            wc -c /tmp/release-notes.md
            gh release edit "$tag" --notes-file /tmp/release-notes.md
            exit 0
          fi
          echo "no custom notes; falling back to CHANGELOG"
          python3 - "$version" <<'PY'
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          changelog = Path("CHANGELOG.md").read_text()
          match = re.search(
              rf"^## v{re.escape(version)}\b.*?(?=^## |\Z)",
              changelog,
              re.MULTILINE | re.DOTALL,
          )
          if not match:
              raise SystemExit(f"CHANGELOG entry for v{version} not found")
          body = match.group(0).split("\n", 1)[1].strip()
          notes = f"# FileHub v{version}\n\n{body}\n"
          chinese = Path("CHANGELOG.zh-CN.md")
          if chinese.exists():
              text = chinese.read_text()
              zh_match = re.search(
                  rf"^## v{re.escape(version)}\b.*?(?=^## |\Z)",
                  text,
                  re.MULTILINE | re.DOTALL,
              )
              if zh_match:
                  zh_body = zh_match.group(0).split("\n", 1)[1].strip()
                  notes += f"\n---\n\n# FileHub v{version}（中文）\n\n{zh_body}\n"
          notes += (
              f"\n**Full Changelog**: https://github.com/Llesue/filehub/compare/"
              f"v{version.rsplit('.', 1)[0]}.{int(version.rsplit('.', 1)[1]) - 1}"
              f"...v{version}\n"
          )
          Path("/tmp/release-notes.md").write_text(notes)
          PY
          gh release edit "$tag" --notes-file /tmp/release-notes.md
